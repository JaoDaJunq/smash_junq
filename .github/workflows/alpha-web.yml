name: Alpha Web

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - "game/**"
      - ".github/workflows/alpha-web.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: alpha-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import project
        run: godot --headless --editor --path game --import
      - name: Export web
        run: |
          mkdir -p build/web
          godot --headless --path game --export-release "Web" ../build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          touch build/web/.nojekyll
      - name: Upload web build for review
        uses: actions/upload-artifact@v4
        with:
          name: smash-junq-alpha-web
          path: build/web/
          retention-days: 14
      - name: Setup Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/
      - name: Deploy Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
        environment:
          name: github-pages
          url: ${{ steps.deployment.outputs.page_url }}
